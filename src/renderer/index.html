<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <title>quotadeck</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="titlebar drag">
        <span class="brand">quotadeck</span>
        <span id="anchor" class="title-meta mono">-</span>
        <button id="refresh" class="icon-button no-drag" type="button" title="Refresh quota" aria-label="Refresh quota">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 7v5h-5" />
            <path d="M4 17v-5h5" />
            <path d="M6.1 9a7 7 0 0 1 11.2-2.3L20 9M4 15l2.7 2.3A7 7 0 0 0 17.9 15" />
          </svg>
        </button>
        <button id="hide" class="icon-button no-drag" type="button" title="Hide" aria-label="Hide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>

      <nav class="tabs no-drag" aria-label="quotadeck views">
        <div class="tabs-list" role="tablist">
          <button class="tab" id="tab-quotas" type="button" role="tab" aria-selected="true" aria-controls="view-quotas">
            Quotas
          </button>
          <button
            class="tab"
            id="tab-activity"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="view-activity"
            tabindex="-1"
          >
            Activity
          </button>
          <button
            class="tab"
            id="tab-health"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="view-health"
            tabindex="-1"
          >
            Health
          </button>
        </div>
      </nav>

      <main class="no-drag">
        <section
          class="view quota-view active"
          id="view-quotas"
          role="tabpanel"
          aria-labelledby="tab-quotas"
        ></section>
        <section
          class="view secondary-view"
          id="view-activity"
          role="tabpanel"
          aria-labelledby="tab-activity"
          hidden
        ></section>
        <section
          class="view secondary-view"
          id="view-health"
          role="tabpanel"
          aria-labelledby="tab-health"
          hidden
        ></section>
      </main>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
