# pnpm 10+ reads settings from here rather than the `pnpm` field in
# package.json, and blocks dependency install scripts unless allowlisted.
# These three genuinely need one:
#
#   electron             downloads its ~235 MB runtime in postinstall
#   esbuild              resolves its platform binary
#   electron-winstaller  pulled in by electron-builder on Windows
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
